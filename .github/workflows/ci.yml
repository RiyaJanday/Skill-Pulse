name: CI

# Runs on every push to main and on every pull request.
on:
  push:
    branches: [main]
  pull_request:

# Cancel an older run of the same branch when a newer push arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ml-service:
    name: ML service tests (Python 3.11)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml-service/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        # No API keys here on purpose: the tests must pass without calling any real LLM.
        run: python -m pytest -q
        env:
          GROQ_API_KEY: ""
          GEMINI_API_KEY: ""
          ML_SERVICE_KEY: ""

  backend:
    name: Backend build (Java 8, same as the Dockerfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven

      - name: Compile and package
        run: mvn -B -ntp verify

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [ml-service, backend]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t skillpulse-backend .

      - name: Build ML service image
        # The Dockerfile trains the recall model at build time, so this also proves training works.
        run: docker build -t skillpulse-ml ml-service
