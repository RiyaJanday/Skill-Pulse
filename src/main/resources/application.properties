server.port=8080
spring.application.name=skillpulse-backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/skillpulse_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Persist Spring Security sessions in PostgreSQL instead of application memory.
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=always
spring.session.timeout=30m
server.servlet.session.cookie.name=SKILLPULSE_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=strict


# All AI/ML (BKT, spaced repetition, recall model, LLM plans) runs in the Python ml-service.
# LLM provider keys (GROQ_API_KEY etc.) now belong in ml-service/.env, not here.
skillpulse.ml.enabled=${SKILLPULSE_ML_ENABLED:true}
skillpulse.ml.base-url=${ML_SERVICE_URL:http://localhost:8001}
skillpulse.ml.key=${ML_SERVICE_KEY:}
skillpulse.ml.timeout-ms=${ML_TIMEOUT_MS:3000}
skillpulse.ml.plan-timeout-seconds=${ML_PLAN_TIMEOUT_SECONDS:60}
skillpulse.admin.email=${SKILLPULSE_ADMIN_EMAIL:amanskr94@gmail.com}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:skillpulse21@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
skillpulse.mail.from=${MAIL_FROM:${MAIL_USERNAME:no-reply@skillpulse.local}}
skillpulse.app.base-url=${SKILLPULSE_BASE_URL:http://localhost:8080}
skillpulse.password-reset.minutes=15
skillpulse.notifications.zone=${NOTIFICATION_TIME_ZONE:Asia/Kolkata}
